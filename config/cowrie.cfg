# Overrides only. Defaults live in src/cowrie/data/etc/cowrie.cfg.dist
# and are never edited there: a git pull would overwrite them.
#
# 25 September 2026, session two: live on ports 22 and 23 through systemd
# socket activation. systemd binds the privileged ports as root and hands
# the already-open sockets to this unprivileged process, so nothing here
# runs as root and authbind is not needed at all.
#
# index=N is the Nth ListenStream line in cowrie.socket, in order:
#   index 0 -> 0.0.0.0:22  (ssh)
#   index 1 -> 0.0.0.0:23  (telnet)
# Change the order there and you silently swap the two decoys. Both are
# written as 0.0.0.0 explicitly rather than relying on address-family
# defaults, which is what nearly locked this machine out on Wednesday.

[honeypot]
# svr04 is Cowrie's shipped default and therefore a known fingerprint.
hostname = fileserv01

[ssh]
listen_endpoints = systemd:domain=INET:index=0

[telnet]
enabled = true
listen_endpoints = systemd:domain=INET:index=1
