# Deception Grid -- the OT decoy's Modbus configuration.
# Copy of Conpot's shipped plc_modbus/modbus.toml, edited. See template.toml
# for why this is not edited inside site-packages.

[modbus]
enabled = true
host = "0.0.0.0"

# Still the default high port. Moving to 502 -- the real Modbus port, and the
# whole basis of the OT comparison -- needs systemd socket activation, because
# 502 is privileged and nothing here runs as root. That is a separate change
# with its own unit file, and testing on 5020 first means a mistake in the
# template is found before a privileged port is involved.
port = 5020

# Left as "serial" despite this being Modbus/TCP. Counter-intuitive, and it was
# the main risk in the build, so it was tested with raw MBAP-framed frames over
# a socket rather than with a client library: a standard read returned a
# correctly formed exception and a device-identification request returned the
# three strings below, length-prefixed, exactly as a real controller would.
# Changing it is not necessary and would invalidate that test.
mode = "serial"
delay = 0

# Was true. UMAS is Schneider Electric's proprietary protocol layered over
# Modbus. With a WAGO identity below, answering UMAS would be a contradiction --
# and a specific, checkable one, since a scanner that speaks UMAS would get a
# reply from a vendor that has never implemented it. The identity has to be
# coherent all the way down or it is not an identity, it is a costume.
umas_enabled = false

[modbus.device_info]
# This is what actually goes on the wire, in response to a
# Read Device Identification request. Was Schneider Electric / Modicon M340 /
# BMXP342020 -- real and plausible, but Conpot's default, so every unmodified
# Conpot on the internet claims to be that same M340 with the same four blocks
# of eight registers at the same addresses. Keeping it means blending in with
# other honeypots rather than with real plants.
#
# A WAGO 750-series fieldbus controller speaks Modbus/TCP natively and is
# ordinary equipment in a small European plant, which is the scenario this
# project is about.
VendorName = "WAGO Kontakttechnik"
ProductCode = "750-8202"
MajorMinorRevision = "FW14"

[[modbus.slaves]]
id = 1

# starting_address was 1, 10001, 30001 and 40001. Those are the DOCUMENTATION
# convention -- the numbering in a manual, where holding registers are "4xxxx".
# Conpot treats the value literally as the wire address, which was confirmed by
# testing: a read at 40001 answered, and a read at 0 returned exception 02,
# illegal data address.
#
# On the wire, holding register 40001 in a manual IS address 0. So the shipped
# template answers nothing at the addresses a scanner actually asks for, and
# returns errors at the addresses every real controller answers. That loses the
# data and is a tell in its own right.
#
# All four start at 0 because Modbus keeps coils, discrete inputs, input
# registers and holding registers in four separate address spaces. Four blocks
# at address 0 is normal and correct, not a collision.
blocks = [
  { name = "memoryModbusSlave1BlockA", type = "COILS",             starting_address = 0, size = 8, content = "memoryModbusSlave1BlockA" },
  { name = "memoryModbusSlave1BlockB", type = "DISCRETE_INPUTS",   starting_address = 0, size = 8, content = "memoryModbusSlave1BlockB" },
  { name = "memoryModbusSlave1BlockC", type = "ANALOG_INPUTS",     starting_address = 0, size = 8, content = "memoryModbusSlave1BlockC" },
  { name = "memoryModbusSlave1BlockD", type = "HOLDING_REGISTERS", starting_address = 0, size = 8, content = "memoryModbusSlave1BlockD" },
]
