; conpot.cfg -- Deception Grid, the OT decoy's core configuration.
;
; Lives at /home/conpot/conpot.cfg, owned by conpot, and is passed explicitly:
;
;   conpot -c /home/conpot/conpot.cfg \
;          -t /home/conpot/templates/plant-plc \
;          -l /home/conpot/log/conpot.log \
;          --temp_dir /home/conpot/tmp
;
; It is a copy of the shipped testing.cfg with five deliberate changes, each
; noted below. The shipped file lives inside site-packages and is never edited
; in place: a `uv pip install --upgrade` would overwrite it and take the changes
; with it. Same reasoning as Cowrie's etc/cowrie.cfg.

[common]
; CHANGE 1. Was `default`. Every event carries this in its `sensor` field, and
; the analysis identifies the sensor by that field rather than by destination
; address, because Azure translates and dst_ip is always the private address.
; Two decoys on one machine means the field has to distinguish them.
sensorid = decoy-01-ot

[virtual_file_system]
data_fs_url = default
fs_url = default

[session]
timeout = 30

[daemon]
; Left commented. systemd runs the service as the conpot user via the unit's
; User= and Group=, so Conpot must not also try to drop privileges itself.
;user = conpot
;group = conpot

[json]
; CHANGE 2, and the one that would have cost the most. This ships DISABLED,
; with a path the conpot user cannot write. Opening the OT door without fixing
; it would have produced a decoy that answered Modbus correctly and recorded
; nothing at all -- a silent failure discovered weeks later, which is the exact
; failure mode this project is built to avoid.
enabled = True
filename = /home/conpot/log/conpot.json

[sqlite]
; Not needed. analysis/ingest.py builds the database from the JSON log, so a
; second store would be a second version of the truth.
enabled = False

[syslog]
enabled = False
device = /dev/log
host = localhost
port = 514
facility = local0
socket = dev        ; udp (sends to host:port), dev (sends to device)

[hpfriends]
; MUST STAY DISABLED. This publishes captured events to a third-party
; honeypot-sharing network. Shipped with working credentials, so enabling it is
; one word away. Sending our data anywhere is outside this project's scope and
; nobody has consented to it.
enabled = False
host = hpfriends.honeycloud.net
port = 20000
ident = 3Ykf9Znv
secret = 4nFRhpm44QkG9cvD
channels = ["conpot.events", ]

[taxii]
; MUST STAY DISABLED, same reason -- this reports to a MITRE TAXII server.
enabled = False
host = taxiitest.mitre.org
port = 80
inbox_path = /services/inbox/default/
use_https = False

[fetch_public_ip]
; CHANGE 3. Was True. On startup Conpot fetched the machine's own public
; address from an external service, which put `Fetched 68.210.98.198 as
; external ip` in the log -- an outbound connection from the sensor, and a
; direct contradiction of docs/rules-of-engagement.md, which says this project
; only ever receives.
;
; Turning it off here is necessary but not sufficient. The firewall rule added
; on 29 September rejects outbound connections for uid 1001 only, which is the
; cowrie user; conpot runs as a different user and is not covered by it. See
; docs/build.md, "Stopping the decoys reaching out". Either extend that rule to
; conpot's uid as well, or accept that this setting is the only thing standing
; between the sensor and an outbound connection -- and a setting is a statement
; of intent where a packet filter is a fact.
;
; The urls are left in place, commented, as a record of where it would have
; connected to.
enabled = False
;urls = ["http://whatismyip.akamai.com/", "http://wgetip.com/"]
